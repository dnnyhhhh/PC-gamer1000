
name: PC Virtual Windows

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Iniciar PC Virtual
        shell: pwsh
        run: |
          Write-Host "PC Virtual iniciado!"
          Write-Host "Sistema operacional:"
          Get-ComputerInfo | Select-Object WindowsProductName
          
      - name: Verificar processador
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor |
          Select-Object Name

      - name: Verificar memoria RAM
        shell: pwsh
        run: |
          Get-CimInstance Win32_ComputerSystem |
          Select-Object TotalPhysicalMemory

      - name: Verificar armazenamento
        shell: pwsh
        run: |
          Get-PSDrive C |
          Select-Object Used,Free

      - name: Testar ambiente
        shell: pwsh
        run: |
          Write-Host "Ambiente Windows funcionando!"
          Write-Host "Preparado para executar tarefas."

      - name: Finalizar
        shell: pwsh
        run: |
          Write-Host "Verificacao concluida!"
